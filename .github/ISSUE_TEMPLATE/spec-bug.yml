name: Spec bug
description: Report errata or editorial bugs in existing normative text.
title: "[spec-bug] "
labels: ["spec-bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This template is for errata and editorial bugs in existing normative text, not for proposals.**

        Use this template to report:

        - Typos, grammar errors, or wording fixes in the specification text.
        - Broken internal links between sections or to anchors.
        - Ambiguous normative language in existing text (for example, unclear use of MUST, SHOULD, or MAY).
        - Inconsistencies between sections, between prose and the JSON Schema, or between prose and the test vectors.
        - JSON Schema errors in `spec/v0.1/schema.json`.
        - Test vector errors in `spec/v0.1/test-vectors/`.

        **If you are proposing a new claim type (core or extension), a change to the LIP process, or any addition to the specification, this is not the right template.** See LIP-1 at <https://llmo.org/spec/lips/lip-0001> for the proposal process.
  - type: input
    id: section
    attributes:
      label: Specification section
      description: The section reference (for example, §4.2, Appendix A, `schema.json` line N).
      placeholder: "§4.2"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What the specification currently says
      description: Quote or paraphrase the current text, schema fragment, or test vector field.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: The problem
      description: What is ambiguous, incorrect, or inconsistent?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed fix (optional)
      description: If you have a concrete suggestion for the revised text, schema fragment, or vector value, include it here.
  - type: textarea
    id: impact
    attributes:
      label: Implementation impact (optional)
      description: If this bug affects implementations, describe the resulting ambiguity or incompatibility.
