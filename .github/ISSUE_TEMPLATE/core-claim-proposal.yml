name: Core claim type proposal
description: Propose a change to the core claim set (editor-mediated review during transitional state).
title: "[core-proposal] "
labels: ["core-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        **Open this issue to propose a change to the LLMO specification's core claim set** (a new core claim type, a modification to an existing core claim type, or removal of an existing core claim type).

        Formal submission mechanics for proposals are defined in LIP-1 for extension claim type proposals. A forthcoming Process LIP will formalize submission mechanics for core claim type proposals.

        Until that Process LIP is accepted, core claim type proposals proceed through editor-mediated review using the 14-day substantive-change governance window defined on the governance page. Open this issue to start the conversation; the editor will guide the proposal through the review window and (if accepted) into a pull request.

        - LIP-1 (proposal process): <https://llmo.org/spec/lips/lip-0001>
        - Governance page (decision process and substantive-change window): <https://llmo.org/about/governance>
  - type: input
    id: section
    attributes:
      label: Specification section affected
      description: The section reference (for example, §3.2, Appendix A). If the proposal adds a new claim type, reference the section where it would be inserted.
      placeholder: "§3.2"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change. For a new core claim type, include the claim type name, its purpose, its fields and their types, and validation rules. For a modification, state the current behavior and the proposed behavior.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this change needed? What problem does it solve? What use cases does it enable?
    validations:
      required: true
  - type: textarea
    id: compat
    attributes:
      label: Backwards-compatibility implications
      description: How does this change affect existing implementations, existing published `llmo.json` documents, and the existing test vectors? State "None" if the change is strictly additive and has no compatibility implications.
    validations:
      required: true
