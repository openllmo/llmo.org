name: Extension claim type registration
description: Register a new extension claim type in the LLMO extensions registry.
title: "[extension-proposal] "
labels: ["extension-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Extension claim types use dot-separated namespaces and MAY be ignored by consumers that do not recognize them. Read the [extensions registry page](https://llmo.org/claims/extensions) for the submission format and promotion path.
  - type: input
    id: namespace
    attributes:
      label: Proposed namespace
      description: The namespace before the final dot SHOULD be an identifier the submitter controls, ideally matching a domain they own.
      placeholder: "e.g., acme.procurement_status"
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: JSON Schema fragment for the statement payload
      description: Use a fenced code block with `json`.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Worked example
      description: At least one example of a valid claim object.
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: Submitting organization
      description: The organization that will use this extension. At least one is required.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact information
      description: Email or GitHub handle for follow-up.
    validations:
      required: true
