name: Weekly Digest

on:
  schedule:
    # Mondays 13:00 UTC = 09:00 US/Eastern (EDT). In EST this becomes 08:00.
    # The choice of fixed-UTC over fixed-Eastern is intentional: cron has no
    # DST awareness, and UTC is the project's reference time zone.
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, inclusive). Leave blank for previous ISO week.'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD, inclusive). Leave blank for previous ISO week.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate digest
        id: gen
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail
          if [[ -n "${START_DATE:-}" && -n "${END_DATE:-}" ]]; then
            python3 scripts/weekly-digest.py "$START_DATE" "$END_DATE"
          elif [[ -n "${START_DATE:-}" || -n "${END_DATE:-}" ]]; then
            echo "::error::Provide both start_date and end_date, or neither."
            exit 1
          else
            python3 scripts/weekly-digest.py
          fi
          # Identify the digest file the script wrote so downstream steps can act on it.
          CHANGED=$(git status --porcelain infrastructure/weekly-digest/ | awk '{print $2}' | head -n 1)
          if [[ -z "$CHANGED" ]]; then
            # Possibly an idempotent regeneration of an already-committed file.
            # Find the latest *.md under the digest dir and use that.
            CHANGED=$(ls -1 infrastructure/weekly-digest/*.md 2>/dev/null | sort | tail -n 1 || true)
          fi
          if [[ -z "$CHANGED" ]]; then
            echo "::error::weekly-digest.py produced no file under infrastructure/weekly-digest/"
            exit 1
          fi
          BASENAME=$(basename "$CHANGED" .md)
          # ISO designator like 2026-W19. Split into year/week for the commit message.
          YEAR="${BASENAME%-W*}"
          WEEK="${BASENAME#*-W}"
          echo "file=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "iso=${BASENAME}" >> "$GITHUB_OUTPUT"
          echo "year=${YEAR}" >> "$GITHUB_OUTPUT"
          echo "week=${WEEK}" >> "$GITHUB_OUTPUT"
          echo "msg=digest: week ${WEEK} of ${YEAR}" >> "$GITHUB_OUTPUT"

      # Mint an installation token from the llmo-workflow-bot GitHub App.
      # PRs created via GITHUB_TOKEN do not trigger pull_request-event
      # workflows (anti-recursion safeguard), so required checks never run
      # and auto-merge never fires. PRs created via an App-installation
      # token do trigger workflows, so this is the path that lets the
      # weekly digest land unattended under enforced branch protection.
      # Branch creation, commit, and push above continue to use
      # GITHUB_TOKEN; only PR creation and merge-queue need the App token.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.LLMO_WORKFLOW_BOT_APP_ID }}
          private-key: ${{ secrets.LLMO_WORKFLOW_BOT_PRIVATE_KEY }}

      - name: Open PR for digest file (auto-merge)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          FILE="${{ steps.gen.outputs.file }}"
          ISO="${{ steps.gen.outputs.iso }}"
          MSG="${{ steps.gen.outputs.msg }}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Digest unchanged from what is already on main; nothing to commit."
            exit 0
          fi

          BRANCH="digest/${ISO}-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "$MSG"
          git push -u origin "$BRANCH"

          # PR body summarizes the digest and notes the auto-merge intent.
          BODY_FILE=$(mktemp)
          {
            echo "Automated weekly digest run."
            echo
            echo "Period: ISO week ${ISO}."
            echo
            echo "<details><summary>Digest preview</summary>"
            echo
            cat "$FILE"
            echo
            echo "</details>"
            echo
            echo "_Workflow: \`.github/workflows/weekly-digest.yml\`. Triggered: \`schedule\` (Monday 13:00 UTC) or manual dispatch._"
          } > "$BODY_FILE"

          PR_URL=$(gh pr create \
            --title "$MSG" \
            --body-file "$BODY_FILE" \
            --label "digest")

          echo "Opened $PR_URL"
          # Queue auto-merge so the PR self-merges once required checks pass.
          # If auto-merge is not enabled at the repo level, this command fails
          # and the PR stays open for manual merge.
          gh pr merge --squash --auto "$PR_URL" || echo "Auto-merge not available; PR left open for manual merge."
