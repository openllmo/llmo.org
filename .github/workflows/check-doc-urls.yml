name: Check Document URLs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-urls:
    name: check-urls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Check documented URLs
        run: bash scripts/check-doc-urls.sh
